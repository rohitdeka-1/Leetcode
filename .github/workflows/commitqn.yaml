name: LeetCode Progress Tracker

on:
  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan LeetCode solutions
        run: |
          python <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          repo = Path(".")
          
          # Calculate current time in IST (UTC+5:30)
          ist = timezone(timedelta(hours=5, minutes=30))
          now_ist = datetime.now(ist)
          
          # Always use yesterday's date in IST
          yesterday_ist = now_ist - timedelta(days=1)
          date_str = yesterday_ist.strftime('%Y-%m-%d')
          
          progress_file = repo / f"{date_str}-progress.txt"

          # Directories that are not LeetCode problems
          ignored = {
              ".git",
              ".github",
              ".vscode",
              "node_modules",
              "__pycache__",
              ".idea"
          }

          # Read existing entries from ALL previous progress files
          existing = set()
          for pf in repo.glob("*-progress.txt"):
              if pf.is_file():
                  existing.update(
                      line.strip()
                      for line in pf.read_text(encoding="utf-8").splitlines()
                      if line.strip()
                  )

          # Find problem folders at the repository root
          problem_folders = sorted(
              folder.name
              for folder in repo.iterdir()
              if folder.is_dir()
              and folder.name not in ignored
              and not folder.name.startswith(".")
          )

          # Identify new problems
          new_problems = [
              name for name in problem_folders
              if name not in existing
          ]

          if new_problems:
              with progress_file.open(
                  "a",
                  encoding="utf-8"
              ) as file:
                  for problem in new_problems:
                      file.write(problem + "\n")

              print(f"Added {len(new_problems)} new problems:")
              for problem in new_problems:
                  print(f"+ {problem}")
          else:
              print("No new LeetCode problems found.")
          PY

      - name: Commit and push progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *-progress.txt

          if git diff --cached --quiet; then
            echo "Progress is already up to date."
            exit 0
          fi

          git commit -m "chore: update LeetCode progress"
          git pull --rebase origin main
          git push origin HEAD:main